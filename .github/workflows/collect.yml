name: Collect research papers
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: goodscroll-collect
  cancel-in-progress: false
jobs:
  collect:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect scholarly metadata
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python collector/research.py
      - name: Commit updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/feed.json app/data/health.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh research catalogue"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - name: Deploy refreshed research catalogue
        uses: actions/configure-pages@v5
      - name: Upload refreshed website
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Publish refreshed website
        id: deployment
        uses: actions/deploy-pages@v4
